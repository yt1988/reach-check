<!doctype html>
<html lang="{{lang}}" data-paths="{{pathsAttr}}"{{rootAttr}}>
<head>
<meta charset="utf-8">
<script>{{prepaint}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
{{head}}
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/{{css}}">
</head>
<body>
<div class="app">
  <div class="top">
    <a class="brand" href="{{homeHref}}"><span class="logo"><img class="logo-light" src="/assets/logo-light.svg" width="90" height="36" alt="1ms" loading="lazy"><img class="logo-dark" src="/assets/logo-dark.svg" width="90" height="36" alt="1ms" loading="lazy"></span><span class="brand-name">{{appName}}</span></a>
    <div class="top-acts">
      <label class="sel"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.8 1.7 2.7 3.8 2.7 6.2S9.8 12.5 8 14.2C6.2 12.5 5.3 10.4 5.3 8S6.2 3.5 8 1.8z"/></svg><span class="sr" data-i="lang_label"></span>
        <select id="lang">{{langOpts}}</select></label>
      <button class="icon-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help"><span class="sr" data-i="faq_h"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4M8 11.3v.1"/></svg>
      </button>
      <a class="icon-btn gh" href="https://github.com/yt1988/reach-check" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a>
      <button class="icon-btn" id="theme" type="button" aria-label="{{a:a_theme}}">
        <svg class="i-sys" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="8.5" rx="1.5"/><path d="M6 14h4M8 11.5V14"/></svg>
        <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>
        <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
      </button>
    </div>
  </div>

  <header class="hero card">
    <h1>{{h1}}</h1>
    <p class="intro" data-i="intro"></p>

    <form id="f" class="form" autocomplete="off">
      <div class="row">
        <label class="fld grow"><span data-i="f_target"></span>
          <input id="target" name="t" placeholder="{{a:f_target_ph}}" spellcheck="false" inputmode="url" required>
        </label>
        <label class="fld port"><span data-i="f_port"></span>
          <input id="port" name="p" inputmode="numeric" pattern="[0-9]*" placeholder="443">
        </label>
        <label class="fld ipv"><span data-i="f_ipv"></span>
          <select id="ipv"><option value="4">IPv4</option><option value="6">IPv6</option></select>
        </label>
        <button id="go" class="btn" type="submit" data-i="go"></button>
      </div>
      <div class="presets" id="presets"></div>
      <div class="sub">
        <button type="button" class="link" id="myip" data-i="myip_btn"></button>
        <span id="myipNote" class="m"></span>
        <span class="quota m" id="quota"></span>
      </div>
    </form>
  </header>

  <section id="out" hidden>
    <div class="card verdict" id="verdict">
      <div class="v-head"><span class="dot" id="vDot"></span><h2 id="vTitle">&nbsp;</h2><button class="btn share" id="shareBtn" type="button" hidden data-i="share"></button></div>
      <p class="v-sub m" id="vSub">&nbsp;</p>
      <ol class="steps" id="vSteps"></ol>
    </div>

    <div class="card sec">
      <div class="sec-h"><h3 data-i="h_regions"></h3><span class="m" id="gpProgress"></span></div>
      <div class="legend m">
        <span><i class="seg s-dns"></i><span data-i="lg_dns"></span></span><span><i class="seg s-tcp"></i><span data-i="lg_tcp"></span></span><span><i class="seg s-tls"></i><span data-i="lg_tls"></span></span><span><i class="seg s-fb"></i><span data-i="lg_fb"></span></span><span><i class="seg s-dl"></i><span data-i="lg_dl"></span></span>
      </div>
      <p class="src m">{{srcGp}}</p>
      <div id="regions" class="regions"></div>
      <p class="note" id="gpNote" hidden></p>
    </div>

    <div class="grid2">
      <div class="card sec">
        <div class="sec-h"><h3 data-i="h_local"></h3></div>
        <div id="local" class="local"></div>
        <p class="note m" data-i="local_note"></p>
        <p class="note" id="checkLink"></p>
      </div>
      <div class="card sec">
        <div class="sec-h"><h3 data-i="h_dns"></h3></div>
        <div id="dns" class="dns"></div>
        <p class="note m" data-i="src_dns"></p>
      </div>
    </div>

    <div class="card sec invite">
      <div class="sec-h"><h3 data-i="h_invite"></h3></div>
      <p class="m" data-i="invite_p"></p>
      <div class="copy"><input id="inviteUrl" readonly aria-label="{{a:h_invite}}"><button class="btn ghost" type="button" id="copyInvite" data-i="copy"></button></div>
    </div>
  </section>
  <footer class="foot m"><p>{{footSrc}}</p><a href="https://github.com/yt1988/reach-check" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
</div>
<div class="scrim" id="help" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpT">
    <div class="dlg-h"><h2 id="helpT" data-i="faq_h"></h2>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="help-b">
      <nav class="help-nav" id="helpNav" role="tablist">{{helpNav}}</nav>
      <div class="help-pick">
        <button class="icon-btn" type="button" data-hstep="-1" aria-label="{{a:a_prev}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg></button>
        <select id="helpSel" aria-labelledby="helpT"></select>
        <button class="icon-btn" type="button" data-hstep="1" aria-label="{{a:a_next}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button>
      </div>
      <div class="help-c" id="helpC">{{helpC}}</div>
    </div>
  </div>
</div>
<script type="application/json" id="data">{{data}}</script>
<script src="/assets/{{strings}}"></script>
<script src="/assets/{{js}}"></script>
</body>
</html>
