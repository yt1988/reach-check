# Cloudflare Workers with static assets: `npx wrangler deploy` uploads ./public.
# There is no Worker script, so every request is a static asset request (free and not metered). The checks run in the
# visitor's browser: Globalping's probes for the outside view, the browser itself for "from here".
name = "reach-check"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
